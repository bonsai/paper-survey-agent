[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-survey-agent"
version = "0.1.0"
description = "LangGraph-based multi-agent system for automated academic paper surveys"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "bonsai"}]
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "pdfplumber>=0.11.0",
    "pypdf>=5.0.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "rich>=13.8.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
survey-agent = "main:main"

[tool.setuptools.packages.find]
where = ["src"]
